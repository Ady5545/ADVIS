name: Build ADVIS Desktop Agent
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-desktop-agent.yml'
permissions:
  contents: read
jobs:
  package:
    name: Package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run desktop:package:mac
            artifact: advis-desktop-macos
          - os: windows-latest
            command: npm run desktop:package:win
            artifact: advis-desktop-windows
          - os: ubuntu-latest
            command: npm run desktop:package:linux
            artifact: advis-desktop-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build desktop package
        run: ${{ matrix.command }}
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 14